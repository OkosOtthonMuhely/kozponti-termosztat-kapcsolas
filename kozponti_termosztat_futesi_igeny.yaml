blueprint:
  name: Központi termosztát a legmagasabb célú szoba alapján (Sonoff TP-WGZBA)
  description: >
    A szobák (radiátor szelepek) közül kiválasztja azt, amelyiknek a legmagasabb
    a célhőmérséklete (egyenlőség esetén a hidegebbet). Ennek a szobának az aktuális
    hőmérsékletét küldi a központi termosztát külső hőmérséklet-bemenetére,
    a központi termosztát célhőmérsékletét pedig erre a legmagasabb célra állítja.
    Így a központi termosztát addig fűt, amíg ez a szoba el nem éri a célját.
    Előfeltétel: a központi termosztáton a hőmérséklet-forrás (temperature_sensor_select)
    legyen "remote_temperature".
  domain: automation
  input:
    zones:
      name: Szobák (szelepek / termosztátok)
      description: Azok a climate entitások, amelyek mért és célhőmérsékletét figyeli.
      selector:
        entity:
          domain: climate
          multiple: true
    central:
      name: Központi termosztát (climate entitás)
      description: Ennek a célhőmérsékletét (setpoint) állítja a blueprint.
      selector:
        entity:
          domain: climate
    ext_input:
      name: A központi termosztát "External temperature" number entitása
      description: >
        A Zigbee2MQTT által létrehozott number entitás (external_temperature_input),
        pl. number.nappali_termosztat_external_temperature
      selector:
        entity:
          domain: number

mode: restart

trigger:
  - platform: state
    entity_id: !input zones
  - platform: time_pattern
    minutes: "/5"
  - platform: homeassistant
    event: start

variables:
  zones: !input zones
  central: !input central
  ext_input: !input ext_input
  best: >
    {% set ns = namespace(z='', t=none, c=none) %}
    {% for z in zones if states(z) not in ['off', 'unavailable', 'unknown'] %}
      {% set cur = state_attr(z, 'current_temperature') %}
      {% set tgt = state_attr(z, 'temperature') %}
      {% if cur is number and tgt is number %}
        {% if ns.t is none or tgt > ns.t or (tgt == ns.t and cur < ns.c) %}
          {% set ns.z = z %}{% set ns.t = tgt %}{% set ns.c = cur %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.z }}
  best_target: "{{ state_attr(best, 'temperature') if best else none }}"
  best_current: "{{ state_attr(best, 'current_temperature') if best else none }}"
  central_target: "{{ state_attr(central, 'temperature') }}"

condition:
  - condition: template
    value_template: "{{ best != '' and best_target is number and best_current is number }}"

action:
  - service: number.set_value
    target:
      entity_id: "{{ ext_input }}"
    data:
      value: "{{ ([[best_current, 0] | max, 99.9] | min) | round(1) }}"
  - choose:
      - conditions: "{{ central_target is not number or (central_target | float - best_target | float) | abs > 0.05 }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: "{{ central }}"
            data:
              temperature: "{{ [[best_target, 5] | max, 30] | min }}"
