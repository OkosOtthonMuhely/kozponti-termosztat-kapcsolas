blueprint:
  name: Központi termosztát külső hőmérséklet-bemenettel (Sonoff TP-WGZBA)
  description: >
    A szobák (radiátor szelepek) közül azt a szobát figyeli, amelyik a saját
    célhőmérsékletéhez képest a leghidegebb (legnagyobb hiány), és ebből egy
    "virtuális" külső hőmérsékletet számol a központi termosztátnak:
    külső hőmérséklet = a központi termosztát célhőmérséklete + a legkisebb (mért - cél) különbség.
    Ha valamelyik szoba hideg, a érték a célhőmérséklet alá kerül, és a központi termosztát fűt.
    Ha minden szoba elérte a célját, az érték a célhőmérséklet fölé kerül, és leáll.
    Előfeltétel: a központi termosztáton a hőmérséklet-forrás (temperature_sensor_select)
    legyen "remote_temperature".
  domain: automation
  input:
    zones:
      name: Szobák (szelepek / termosztátok)
      description: Azok a climate entitások, amelyek mért és célhőmérsékletét figyeli.
      selector:
        entity:
          domain: climate
          multiple: true
    central:
      name: Központi termosztát (climate entitás)
      description: A célhőmérsékletét (setpoint) innen olvassa.
      selector:
        entity:
          domain: climate
    ext_input:
      name: A központi termosztát "External temperature" number entitása
      description: >
        A Zigbee2MQTT által létrehozott number entitás (external_temperature_input),
        pl. number.nappali_termosztat_external_temperature
      selector:
        entity:
          domain: number

mode: restart

trigger:
  - platform: state
    entity_id: !input zones
  - platform: state
    entity_id: !input central
    attribute: temperature
  - platform: time_pattern
    minutes: "/5"
  - platform: homeassistant
    event: start

variables:
  zones: !input zones
  central: !input central
  ext_input: !input ext_input
  ctrl_target: "{{ state_attr(central, 'temperature') }}"
  min_diff: >
    {% set ns = namespace(d=none) %}
    {% for z in zones if states(z) not in ['off', 'unavailable', 'unknown'] %}
      {% set cur = state_attr(z, 'current_temperature') %}
      {% set tgt = state_attr(z, 'temperature') %}
      {% if cur is number and tgt is number %}
        {% set diff = cur - tgt %}
        {% if ns.d is none or diff < ns.d %}{% set ns.d = diff %}{% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.d if ns.d is not none else 3 }}
  ext_temp: >
    {{ ([[ctrl_target + ([min_diff, 3] | min), 0] | max, 99.9] | min) | round(1) }}

condition:
  - condition: template
    value_template: "{{ ctrl_target is number }}"

action:
  - service: number.set_value
    target:
      entity_id: "{{ ext_input }}"
    data:
      value: "{{ ext_temp }}"
